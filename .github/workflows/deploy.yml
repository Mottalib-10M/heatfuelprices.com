name: Relevé hebdomadaire EIA, build et déploiement

# L'EIA publie son enquête hebdomadaire des prix du fioul domestique et du propane (SHOPP) le
# mercredi, d'octobre à mars ; NYSERDA publie ses prix régionaux de l'État de New York peu après.
# Le site se reconstruit le mercredi à 19:30 UTC (après la publication EIA) et le jeudi à 13:30 UTC
# (rattrapage si la publication a pris du retard, et NYSERDA). À chaque passage : relevé
# (scripts/update-data.py : 4 classeurs EIA + data.ny.gov), tests, build, publication sur GitHub
# Pages, et les fichiers de données sont recommités s'ils ont changé. Si une source ne répond pas,
# le script garde le fichier précédent et le site est reconstruit avec lui, date du relevé affichée.
# Aucune clé d'API : données fédérales du domaine public et données ouvertes de l'État de New York.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 3'
    - cron: '30 13 * * 4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          pip install xlrd
      - name: Relevé EIA et NYSERDA
        continue-on-error: true
        run: python3 scripts/update-data.py
      - name: Tests (moteur, pages, cohérence des données)
        run: npx vitest run
      - name: Build (avec contrôle des snippets)
        run: npm run build
      - name: Recommit des données si elles ont changé
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "releve-eia"
          git config user.email "releve-eia@users.noreply.github.com"
          git add src/data/eia.json src/data/ny.json src/data/latest.json src/data/series.json
          if ! git diff --cached --quiet; then
            git commit -m "Données : relevé EIA et NYSERDA du $(date -u +%F)" && git push || echo "push refusé, relevé gardé pour le prochain passage"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh https://heatfuelprices.com
